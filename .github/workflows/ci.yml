name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-app:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy on Ubuntu
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cloud-app:latest
          docker rm -f cloud-app || true
          docker run -d --name cloud-app -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/cloud-app:latest
          sleep 3
          curl -fsS http://localhost:5000
